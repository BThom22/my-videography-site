<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Portfolio | Your Business Name</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>
  <header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="nav-bg"></div>
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <img src="./truenorthminlogo.png" alt="Brand Logo" style="height:30px; margin-right:10px;">
        True North Media
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="nav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
           <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
           <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
          <li class="nav-item"><a class="nav-link active" href="pricing.html">Pricing</a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Client Login</a></li>
        </ul>
      </div>
    </div>
  </nav>
  </header>
    <main class="container portfolio-wrap">
    <header class="text-center mb-4">
      <h1 class="fw-bold">Portfolio</h1>
      <p class="text-muted mb-0">A selection of recent work.</p>
    </header>

    <!-- Grid -->
    <section id="grid" class="grid">
      <!-- Example item – duplicate for each photo -->
      <figure class="grid-item">
        <a href="assets/portfolio/photo-01-lg.jpg" data-title="Sample Project">
          <img
            src="assets/portfolio/photo-01-sm.jpg"
            srcset="assets/portfolio/photo-01-sm.jpg 600w, assets/portfolio/photo-01-lg.jpg 1600w"
            sizes="(max-width: 600px) 100vw, 33vw"
            loading="lazy" alt="Sample Project">
        </a>
      </figure>

      <!-- Add more <figure> blocks for each photo -->
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" aria-label="Close (Esc)">&times;</button>
    <div class="lightbox-inner">
      <img id="lightboxImg" alt="">
      <div id="lightboxCaption" class="caption"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightboxImg');
    const lbCaption = document.getElementById('lightboxCaption');
    const closeBtn = document.querySelector('.lightbox-close');

    function openLightbox(href, title) {
      lb.hidden = false;
      document.body.style.overflow = 'hidden';
      lbImg.src = href;
      lbCaption.textContent = title || '';
      setTimeout(() => lb.classList.add('show'), 10);
    }
    function closeLightbox() {
      lb.classList.remove('show');
      setTimeout(() => { lb.hidden = true; document.body.style.overflow=''; }, 200);
    }

    document.getElementById('grid').addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a) return;
      e.preventDefault();
      openLightbox(a.href, a.getAttribute('data-title'));
    });

    closeBtn.addEventListener('click', closeLightbox);
    lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !lb.hidden) closeLightbox(); });

    // Navbar zoom script
    (function () {
      const collapse = document.querySelector('#nav');
      if (!collapse) return;
      collapse.addEventListener('shown.bs.collapse', () => document.body.classList.add('nav-open'));
      collapse.addEventListener('hidden.bs.collapse', () => document.body.classList.remove('nav-open'));
    })();
  </script>
</body>
</html>
