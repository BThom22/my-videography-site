  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" aria-label="Close (Esc)">&times;</button>
    <div class="lightbox-inner">
      <img id="lightboxImg" alt="">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Simple lightbox
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightboxImg');
    const closeBtn = document.querySelector('.lightbox-close');

    function openLightbox(href) {
      lb.hidden = false;
      document.body.style.overflow = 'hidden';
      lbImg.src = href;
      setTimeout(() => lb.classList.add('show'), 10);
    }
    function closeLightbox() {
      lb.classList.remove('show');
      setTimeout(() => { lb.hidden = true; document.body.style.overflow=''; }, 200);
    }

    document.getElementById('grid').addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a) return;
      e.preventDefault();
      openLightbox(a.getAttribute('href'));
    });
    closeBtn.addEventListener('click', closeLightbox);
    lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !lb.hidden) closeLightbox(); });

    // Navbar zoom script
    (function () {
      const collapse = document.querySelector('#nav');
      if (!collapse) return;
      collapse.addEventListener('shown.bs.collapse', () => document.body.classList.add('nav-open'));
      collapse.addEventListener('hidden.bs.collapse', () => document.body.classList.remove('nav-open'));
    })();
  </script>
